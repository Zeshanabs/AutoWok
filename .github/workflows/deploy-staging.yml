name: Deploy to staging

# Manual only. Nothing is deployed on push or merge.
#
# A person starts this workflow for a chosen commit, and the "staging" GitHub
# environment must be configured with required reviewers so the run waits for
# approval before any step executes. All credentials are environment secrets.
#
# Required "staging" environment secrets:
#   STAGING_SSH_HOST, STAGING_SSH_USER, STAGING_SSH_KEY, STAGING_SSH_KNOWN_HOSTS
#   STAGING_DEPLOY_PATH   directory on the server that holds .env.production
# Required "staging" environment variable:
#   STAGING_PUBLIC_ORIGIN  for example https://staging.example.com
#
# The server's .env.production is created by a person on the server; this
# workflow never reads or writes application secrets. It copies the deployment
# files (Compose file, proxy configuration, scripts) and runs
# scripts/deploy/deploy.sh, which backs up, migrates, starts and verifies.
#
# STATUS: this workflow has not been executed. It needs a staging server and the
# secrets above before its first run. See docs/deployment/STAGING_DEPLOYMENT.md.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, tag or branch to deploy (must have passed CI)"
        required: true
        default: main
      run_migrations:
        description: "Apply database migrations before starting the new version"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  build:
    name: Build and push images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - id: meta
        run: echo "tag=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the API/worker image
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}/backend:${{ steps.meta.outputs.tag }}
          docker build --target runtime -t "$image" backend
          docker push "$image"
      - name: Build and push the web image (the public address is compiled in)
        env:
          PUBLIC_ORIGIN: ${{ vars.STAGING_PUBLIC_ORIGIN }}
        run: |
          test -n "$PUBLIC_ORIGIN" || (echo "Set the STAGING_PUBLIC_ORIGIN environment variable." && exit 1)
          image=ghcr.io/${GITHUB_REPOSITORY,,}/frontend:staging-${{ steps.meta.outputs.tag }}
          docker build --target runtime --build-arg NEXT_PUBLIC_API_BASE_URL="$PUBLIC_ORIGIN" -t "$image" frontend
          docker push "$image"

  deploy:
    name: Deploy to the staging server
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Copy the deployment files (no secrets) to the server
        env:
          TARGET: ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}
          DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
        run: |
          tar -czf - docker-compose.prod.yml infrastructure/proxy scripts/backup scripts/deploy .env.production.example \
            | ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$TARGET" "mkdir -p '$DEPLOY_PATH' && tar -xzf - -C '$DEPLOY_PATH'"
      - name: Back up, migrate, start the new version, verify
        env:
          TARGET: ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}
          DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
          TAG: ${{ needs.build.outputs.tag }}
          RUN_MIGRATIONS: ${{ inputs.run_migrations }}
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          flag=""; [ "$RUN_MIGRATIONS" = "true" ] || flag="--skip-migrations"
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$TARGET" \
            "cd '$DEPLOY_PATH' && sh scripts/deploy/deploy.sh release '$repo/backend:$TAG' '$repo/frontend:staging-$TAG' $flag"
