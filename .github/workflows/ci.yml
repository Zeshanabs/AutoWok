name: Autowok CI

# Runs on every pull request and on pushes to main. It never deploys anything.
# Every job must pass for a change to be mergeable (configure branch protection
# on main to require them). See docs/ci-cd.md.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend - lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -c constraints.txt
      - name: Lint (syntax errors, undefined names, unused code)
        run: ruff check app perf scripts tests
      - name: Byte-compile every module
        run: python -m compileall -q app perf scripts
      - name: Unit and end-to-end tests (in-memory database, mocked external services)
        run: pytest -o addopts="" -q -p no:cacheprovider

  backend-integration:
    name: Backend - PostgreSQL integration and migration validation
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: autowok
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: autowok_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U autowok -d autowok_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://autowok:ci-only-password@localhost:5432/autowok_test
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -c constraints.txt
      - name: Migrations apply from an empty database
        run: alembic upgrade head
      - name: Models and migrations agree (no drift)
        run: alembic check
      - name: Latest migration is reversible
        run: |
          alembic downgrade -1
          alembic upgrade head
          alembic check
      - name: Application starts and reports ready against real PostgreSQL and Redis
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/ready; then exit 0; fi
            sleep 1
          done
          echo "The API did not become ready" && exit 1
      - name: Full test suite against PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+psycopg://autowok:ci-only-password@localhost:5432/autowok_test
        run: pytest -o addopts="" -q -p no:cacheprovider

  frontend:
    name: Frontend - lint, types, tests, production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install from the lockfile
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: |
          npx next typegen
          npx tsc --noEmit
      - name: Tests
        run: npm test
      - name: Production build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://app.example.com
          NEXT_OUTPUT: standalone
        run: npm run build

  security:
    name: Dependency and secret checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Python dependencies - known vulnerabilities
        # Accepted advisories (with the reason and a review date) are listed in
        # docs/dependency-audit.md and passed with --ignore-vuln.
        run: |
          python -m pip install --upgrade pip pip-audit==2.7.3
          pip-audit --requirement backend/constraints.txt --no-deps --disable-pip
      - name: Frontend production dependencies - known vulnerabilities (high and critical)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: No secrets or environment files are committed
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '\.example$'; then
            echo "An environment file is tracked by git." && exit 1
          fi
          # High-signal credential shapes: Groq keys, Meta tokens, private keys, AWS keys.
          if git grep -nIE '(gsk_[A-Za-z0-9]{40,}|EAA[A-Za-z0-9]{60,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|AKIA[0-9A-Z]{16})' -- . ':!frontend/package-lock.json'; then
            echo "A credential-like string is committed." && exit 1
          fi

  docker:
    name: Container images - build and scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Development Compose file is valid
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config -q
      - name: Production Compose file is valid and publishes only the proxy
        run: |
          cat > .env.production <<'EOF'
          SITE_ADDRESS=app.example.com
          PUBLIC_ORIGIN=https://app.example.com
          ALLOWED_HOSTS=app.example.com
          ACME_EMAIL=ops@example.com
          POSTGRES_PASSWORD=ci-only-password
          REDIS_PASSWORD=ci-only-password
          EOF
          docker compose --env-file .env.production -f docker-compose.prod.yml config > /tmp/prod.yml
          published=$(grep -c 'published:' /tmp/prod.yml)
          test "$published" = "2" || (echo "Expected only ports 80 and 443 to be published, found $published" && exit 1)
      - name: The backup job's image has its tools without internet access
        # The job runs on an internal network, so it cannot install anything at run time.
        run: |
          image=$(docker compose --env-file .env.production -f docker-compose.prod.yml --profile ops config --format json | jq -r '.services.backup.image')
          docker run --rm --network none --entrypoint sh "$image" -c 'for tool in openssl pg_dump pg_restore psql sha256sum tar; do command -v "$tool" >/dev/null || { echo "missing: $tool"; exit 1; }; done'
      - name: Deployment scripts parse, and the unfilled template is rejected
        run: |
          for f in scripts/deploy/*.sh scripts/backup/*.sh; do sh -n "$f"; done
          if PREFLIGHT_SKIP_DOCKER=1 sh scripts/deploy/preflight.sh .env.production.example > /tmp/preflight-template.txt; then
            echo "The unfilled template passed the configuration check." && exit 1
          fi
          tail -n 1 /tmp/preflight-template.txt
      - name: Build production images
        run: |
          docker build --target runtime -t autowok-backend:ci backend
          docker build --target runtime --build-arg NEXT_PUBLIC_API_BASE_URL=https://app.example.com -t autowok-frontend:ci frontend
      - name: Images run as a non-root user
        run: |
          test "$(docker run --rm autowok-backend:ci id -u)" != "0"
          test "$(docker run --rm --entrypoint id autowok-frontend:ci -u)" != "0"
      - name: Production image refuses to start with unsafe configuration
        run: |
          if docker run --rm -e APP_ENV=production autowok-backend:ci python -c "import app.main"; then
            echo "The API started in production without its required secrets." && exit 1
          fi
      - name: Required environment variables - a complete configuration passes every check
        # Throwaway values generated for this run only. The check covers the file,
        # the Compose file and the application's own start-up validation in the image.
        run: |
          {
            echo "APP_ENV=production"
            echo "SITE_ADDRESS=app.example.com"
            echo "PUBLIC_ORIGIN=https://app.example.com"
            echo "ALLOWED_HOSTS=app.example.com"
            echo "ACME_EMAIL=ops@example.com"
            sh scripts/deploy/generate-secrets.sh
          } > .env.production
          docker tag autowok-backend:ci autowok-backend:local
          PREFLIGHT_ALLOW_PLACEHOLDERS=1 sh scripts/deploy/preflight.sh
          rm -f .env.production
      - name: Deployment bundle (Compose file, proxy configuration, scripts; no secrets)
        run: tar -czf autowok-deploy-bundle.tar.gz docker-compose.prod.yml infrastructure/proxy scripts/backup scripts/deploy .env.production.example
      - uses: actions/upload-artifact@v4
        with:
          name: autowok-deploy-bundle
          path: autowok-deploy-bundle.tar.gz
          retention-days: 14
      - name: Scan the backend image (fails on critical vulnerabilities with a fix)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: autowok-backend:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan the frontend image (fails on critical vulnerabilities with a fix)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: autowok-frontend:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
