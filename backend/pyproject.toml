[project]
name = "autowok-backend"
version = "0.1.0"
description = "FastAPI backend for Autowok"
readme = "README.md"
requires-python = ">=3.12"
# Pinned versions live in requirements.txt (runtime) and requirements-dev.txt
# (development and CI); the images and CI install from those files.
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 140
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# Correctness only: syntax errors, undefined names, unused imports and variables.
# Formatting is intentionally not enforced on the existing code base.
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841"]
